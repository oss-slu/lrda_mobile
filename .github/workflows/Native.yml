name: App test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum permissions for OSS-SLU supply-chain baseline (SBOM + attestation).
permissions:
  contents: read           
  id-token: write          
  attestations: write      
  artifact-metadata: write  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      # ---- Supply-chain security baseline ----

      - name: Generate workspace SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: lrda-mobile-sbom.spdx.json
          upload-artifact: false   

      # Preserve the SBOM as a downloadable artifact on the run summary page.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lrda-mobile-sbom
          path: lrda-mobile-sbom.spdx.json
          if-no-files-found: error

      # Sign build provenance for the SBOM file
      - name: Attest SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: lrda-mobile-sbom.spdx.json

      # Confirm the attestation just created is valid and bound to this repo.
      - name: Verify SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify lrda-mobile-sbom.spdx.json \
            --repo "${{ github.repository }}"